name: Android upstream build probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-upstream-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upstream-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project notes
        uses: actions/checkout@v4

      - name: Checkout Android Stratagus source
        uses: actions/checkout@v4
        with:
          repository: drodin/Stratagus
          ref: android
          path: upstream-stratagus

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchains
        run: |
          sdkmanager "platforms;android-32" "build-tools;32.0.0" "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Build host tolua++ generator
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl tar liblua5.1-0-dev
          mkdir -p /tmp/toluapp
          curl --fail --location --retry 3 \
            https://codeload.github.com/LuaDist/toluapp/tar.gz/refs/tags/1.0.93 \
            --output /tmp/toluapp.tar.gz
          echo "0a1ff87cb74e7531aec57e2a7cfdf282116647dea3b46223e3cc7c362b55b5bb  /tmp/toluapp.tar.gz" | sha256sum --check
          tar -xzf /tmp/toluapp.tar.gz --strip-components=1 -C /tmp/toluapp
          sed -i 's/VERSION 2.8/VERSION 3.5/' /tmp/toluapp/CMakeLists.txt
          cmake -S /tmp/toluapp -B /tmp/toluapp/build \
            -DLUA_INCLUDE_DIR=/usr/include/lua5.1 \
            -DLUA_LIBRARY=/usr/lib/x86_64-linux-gnu/liblua5.1.so
          cmake --build /tmp/toluapp/build --parallel 2
          sudo install -m 0755 /tmp/toluapp/build/toluapp '/usr/local/bin/tolua++'
          command -v 'tolua++'
          'tolua++' -v || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3.3'

      - name: Repair obsolete Hunter archive reference
        working-directory: upstream-stratagus
        shell: bash
        run: |
          set -euo pipefail
          hunter_url="https://github.com/drodin/hunter/archive/refs/heads/pr.sdl_master.zip"
          curl --fail --location --retry 3 "$hunter_url" --output /tmp/hunter-pr-sdl.zip
          hunter_sha1="$(sha1sum /tmp/hunter-pr-sdl.zip | cut -d ' ' -f 1)"
          sed -i 's#https://github.com/drodin/hunter/archive/refs/heads/pr.sdl.zip#https://github.com/drodin/hunter/archive/refs/heads/pr.sdl_master.zip#' CMakeLists.txt
          sed -i "s#SHA1 \"7146bee57e5e8df23e392b509091eff3468f1c80\"#SHA1 \"$hunter_sha1\"#" CMakeLists.txt
          echo "Hunter archive SHA1: $hunter_sha1"

      - name: Configure SDL2 Hunter build with PIC
        working-directory: upstream-stratagus
        shell: bash
        run: |
          set -euxo pipefail
          hunter_config="cmake/Hunter/config.cmake"
          cat >> "$hunter_config" <<'EOF'

          # Hunter builds SDL2 as a static archive linked into libstratagus.so.
          # Compile the SDL2 objects as position-independent code for Android.
          hunter_config(
              SDL2
              VERSION "2.0.22-22d6e09"
              CMAKE_ARGS
                  CMAKE_C_FLAGS=-fPIC
                  CMAKE_CXX_FLAGS=-fPIC
          )
          EOF
          grep -A7 'hunter_config(' "$hunter_config" | tail -n 8

      - name: Enable position-independent code for Hunter dependencies
        working-directory: upstream-stratagus
        shell: bash
        run: |
          set -euxo pipefail
          toolchain_template="cmake/template/toolchain.cmake.in"
          grep -q 'CMAKE_POSITION_INDEPENDENT_CODE' "$toolchain_template" || printf '\n# Android shared-library dependencies must be built as PIC.\nset(CMAKE_POSITION_INDEPENDENT_CODE ON)\n' >> "$toolchain_template"

      - name: Build upstream debug APK
        working-directory: upstream-stratagus
        run: gradle -p android assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stratagus-upstream-debug-apk
          path: upstream-stratagus/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
